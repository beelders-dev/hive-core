{% extends "base.html" %}
{% block content %}
    <div class="mx-auto max-w-7xl px-4 py-8 font-sans sm:px-6 sm:py-10">
        <!-- Back -->
        <a href="{% url 'inventory:index' %}" class="action">← Back</a>
        <!-- Header -->
        <div class="header-container">
            <div class="min-w-0 flex-1">{% include "components/_page_header.html" with page_title=ingredient.name %}</div>
            <div class="flex flex-wrap gap-2 sm:gap-3">
                <button hx-get="{% url 'inventory:purchase_create' ingredient.pk %}"
                        hx-target="#modal-root"
                        class="action button-primary">Add Purchase Stock</button>
                <button hx-get="{% url 'inventory:update' ingredient.pk %}"
                        hx-target="#modal-root"
                        class="action button-secondary">Edit Ingredient</button>
                <button hx-get="{% url 'inventory:delete' ingredient.pk %}"
                        hx-target="#modal-root"
                        class="action button-delete">Delete</button>
            </div>
        </div>
        <div id="tab-buttons">{% include "inventory/ingredient/partials/detail/_tab_buttons.html" %}</div>
        <div id="detail-content">{% include "inventory/ingredient/partials/detail/_tab_overview.html" %}</div>
    </div>
{% endblock content %}
