{% if ingredient.stock_status == "out" %}
    <span class="stock-badge stock-badge-out inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold sm:px-3 sm:py-1.5 sm:text-sm">
        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
        <span class="sm:hidden">Out</span>
        <span class="hidden sm:inline">Out of Stock</span>
    </span>
{% elif ingredient.stock_status == "low" %}
    <span class="stock-badge stock-badge-low inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold sm:px-3 sm:py-1.5 sm:text-sm">
        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
        <span class="sm:hidden">Low</span>
        <span class="hidden sm:inline">Low Stock</span>
    </span>
{% else %}
    <span class="stock-badge stock-badge-in inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold sm:px-3 sm:py-1.5 sm:text-sm">
        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
        <span class="sm:hidden">Good</span>
        <span class="hidden sm:inline">In Stock</span>
    </span>
{% endif %}
