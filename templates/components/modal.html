<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-2xl overflow-hidden rounded-2xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-200 bg-slate-50 px-6 py-4">
            <h2 class="text-lg font-semibold text-slate-900">
                {% block modal_title %}
                    Modal
                {% endblock modal_title %}
            </h2>
            <button type="button"
                    onclick="document.getElementById('modal-root').innerHTML = ''"
                    class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-200 hover:text-slate-700">✕</button>
        </div>
        <div class="p-6">
            {% block modal_content %}
            {% endblock modal_content %}
        </div>
    </div>
</div>
