{% load static %}
<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 p-3 sm:p-4">
    <div class="flex max-h-[calc(100vh-1.5rem)] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl sm:max-h-[calc(100vh-2rem)] sm:rounded-2xl">
        <!-- Header -->
        <div class="flex shrink-0 items-center justify-between border-b border-slate-200 bg-slate-50 px-4 py-3 sm:px-6 sm:py-4">
            <h2 class="min-w-0 truncate text-base font-semibold text-slate-900 sm:text-lg">
                {% block modal_title %}
                    Modal
                {% endblock modal_title %}
            </h2>
            <button type="button"
                    onclick="document.getElementById('modal-root').innerHTML = ''"
                    aria-label="Close modal"
                    class="ml-3 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-200 hover:text-slate-700">
                <span aria-hidden="true">✕</span>
            </button>
        </div>
        <!-- Content -->
        <div class="min-h-0 overflow-y-auto p-4 sm:p-6">
            {% block modal_content %}
            {% endblock modal_content %}
        </div>
    </div>
</div>
