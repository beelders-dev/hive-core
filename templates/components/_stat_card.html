<div class="card flex min-w-0 items-start justify-between gap-2 p-4 sm:p-6">
    <div class="min-w-0">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">{{ label }}</p>
        <div class="mt-1 flex items-end gap-1">
            {% if prefix %}<span class="text-2xl font-bold text-slate-900 sm:text-3xl">{{ prefix }}</span>{% endif %}
            <span class="font-mono text-3xl font-bold text-slate-900 sm:text-4xl">{{ value|default:"0" }}</span>
            {% if suffix %}<span class="mb-1 shrink-0 text-xs text-slate-500 sm:text-sm">{{ suffix }}</span>{% endif %}
        </div>
        {% if helper %}<p class="hidden md:block mt-1 text-xs text-slate-500">{{ helper }}</p>{% endif %}
    </div>
    {% if badge %}
        <span class="shrink-0 rounded px-2 py-1 text-[10px] font-medium sm:px-3 sm:text-xs {{ badge_class }}">
            {{ badge }}
        </span>
    {% endif %}
</div>
