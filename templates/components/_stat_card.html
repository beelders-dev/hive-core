<div class="card relative overflow-hidden p-4 sm:p-5">
    <div class="min-w-0">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ label }}</p>
        {% if badge %}
            <!-- Status -->
            <div class="mt-3 flex items-center gap-2">
                <span class="h-2.5 w-2.5 shrink-0 rounded-full {{ badge_dot_class }}"></span>
                <span class="truncate text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">{{ badge }}</span>
            </div>
        {% else %}
            <!-- Metric -->
            <div class="mt-2 flex min-w-0 items-baseline gap-1.5">
                {% if prefix %}<span class="text-xl font-semibold text-slate-400 sm:text-2xl">{{ prefix }}</span>{% endif %}
                <span class="truncate font-mono text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
                    {{ value|default:"0" }}
                </span>
                {% if suffix %}<span class="shrink-0 text-xs font-medium text-slate-400 sm:text-sm">{{ suffix }}</span>{% endif %}
            </div>
        {% endif %}
        {% if helper %}<p class="mt-2 text-xs leading-relaxed text-slate-500">{{ helper }}</p>{% endif %}
    </div>
</div>
