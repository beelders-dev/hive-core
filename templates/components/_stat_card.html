<div class="rounded-2xl border {{ border_class|default:'border-slate-200' }} {{ bg_class|default:'bg-white' }} p-5 shadow-sm">
    <div class="flex items-center justify-between">
        <p class="text-sm font-medium {{ label_class|default:'text-slate-500' }}">{{ label }}</p>
        {% if badge %}
            <span class="rounded-full {{ badge_class|default:'bg-slate-100 text-slate-700' }} px-2.5 py-1 text-xs font-semibold">
                {{ badge }}
            </span>
        {% endif %}
    </div>
    <p class="mt-3 text-3xl font-bold tracking-tight {{ value_class|default:'text-slate-950' }}">{{ value }}</p>
    <p class="mt-1 text-sm {{ helper_class|default:'text-slate-500' }}">{{ helper }}</p>
</div>
