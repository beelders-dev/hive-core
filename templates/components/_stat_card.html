<div class="card relative overflow-hidden p-4 sm:p-5 {{ card_class|default:'bg-white' }}">
    <div class="flex items-center justify-between gap-4">
        <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">{{ label }}</p>
        <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-semibold {{ badge_class }}">
            <span class="h-1.5 w-1.5 rounded-full {{ badge_dot_class }}"></span>
            {{ badge }}
        </span>
    </div>
</div>
