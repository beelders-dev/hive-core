<nav class="flex overflow-x-auto" aria-label="Tabs">
        {% for tab in tabs %}
                <button type="button"
                        class="tab-button {% if active_tab == tab.id %}tab-button-active{% endif %}"
                        hx-get="{{ tab.url }}"
                        hx-target="#{{ target }}"
                        hx-swap="innerHTML">{{ tab.label }}</button>
        {% endfor %}
</nav>
