```html
<!-- Desktop Navigation -->
<nav class="hidden items-center gap-6 md:flex">
    <a href="{% url 'home' %}"
       class="text-sm font-medium text-slate-300 transition hover:text-white">Dashboard</a>
    <a href="{% url 'inventory:index' %}"
       class="text-sm font-medium text-slate-300 transition hover:text-white">Inventory</a>
    <a href="{% url 'production:index' %}"
       class="text-sm font-medium text-slate-300 transition hover:text-white">Production</a>
    <div class="ml-4 flex items-center gap-3 border-l border-slate-700 pl-4">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-700 text-xs font-bold text-slate-200">
            {{ user.get_initials }}
        </div>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit"
                    class="text-sm font-medium text-slate-300 transition hover:text-white">Logout</button>
        </form>
    </div>
</nav>
<!-- Mobile Menu Button -->
<div class="ml-auto md:hidden">
    <button type="button"
            id="mobile-menu-button"
            aria-controls="mobile-menu"
            aria-expanded="false"
            class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-300 transition hover:bg-slate-800 hover:text-white">
        <span class="sr-only">Open navigation menu</span>
        <svg class="h-6 w-6"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
</div>
<!-- Mobile Navigation -->
<div id="mobile-menu"
     class="pointer-events-none fixed inset-0 z-[60] md:hidden">
    <!-- Backdrop -->
    <div id="mobile-menu-backdrop"
         class="absolute inset-0 bg-slate-950/50 opacity-0 transition-opacity duration-300"></div>
    <!-- Drawer -->
    <aside id="mobile-menu-panel"
           class="absolute inset-y-0 right-0 flex w-72 max-w-[85vw] translate-x-full flex-col bg-slate-900 shadow-2xl transition-transform duration-300">
        <!-- Drawer Header -->
        <div class="flex h-16 shrink-0 items-center justify-between border-b border-slate-700 px-4">
            <span class="text-lg font-bold tracking-tight text-white">Hi, {{ user.first_name }}</span>
            <button type="button"
                    id="mobile-menu-close"
                    class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-300 transition hover:bg-slate-800 hover:text-white">
                <span class="sr-only">Close navigation menu</span>
                <svg class="h-6 w-6"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"></path>
                </svg>
            </button>
        </div>
        <!-- Navigation Links -->
        <nav class="flex flex-1 flex-col gap-1 overflow-y-auto px-4 py-6">
            <a href="{% url 'home' %}"
               class="rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Dashboard
            </a>
            <a href="{% url 'inventory:index' %}"
               class="rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Inventory
            </a>
            <a href="{% url 'production:index' %}"
               class="rounded-lg px-3 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Production
            </a>
        </nav>
        <!-- User Section -->
        <div class="shrink-0 border-t border-slate-700 p-4">
            <div class="mb-3 flex items-center gap-3 px-3">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-700 text-xs font-bold text-slate-200">
                    {{ user.get_initials }}
                </div>
                <span class="truncate text-sm font-medium text-slate-300">{{ user.get_full_name|default:user.username }}</span>
            </div>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit"
                        class="w-full rounded-lg px-3 py-3 text-left text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                    Logout
                </button>
            </form>
        </div>
    </aside>
</div>
<script>
    const mobileMenu = document.getElementById("mobile-menu");
    const mobileMenuButton = document.getElementById("mobile-menu-button");
    const mobileMenuClose = document.getElementById("mobile-menu-close");
    const mobileMenuBackdrop = document.getElementById("mobile-menu-backdrop");
    const mobileMenuPanel = document.getElementById("mobile-menu-panel");

    function openMobileMenu() {
        mobileMenu.classList.remove("pointer-events-none");

        mobileMenuBackdrop.classList.remove("opacity-0");
        mobileMenuBackdrop.classList.add("opacity-100");

        mobileMenuPanel.classList.remove("translate-x-full");
        mobileMenuPanel.classList.add("translate-x-0");

        mobileMenuButton.setAttribute("aria-expanded", "true");

        document.body.classList.add("overflow-hidden");
    }

    function closeMobileMenu() {
        mobileMenuBackdrop.classList.remove("opacity-100");
        mobileMenuBackdrop.classList.add("opacity-0");

        mobileMenuPanel.classList.remove("translate-x-0");
        mobileMenuPanel.classList.add("translate-x-full");

        mobileMenuButton.setAttribute("aria-expanded", "false");

        document.body.classList.remove("overflow-hidden");

        setTimeout(() => {
            mobileMenu.classList.add("pointer-events-none");
        }, 300);
    }

    mobileMenuButton.addEventListener("click", openMobileMenu);
    mobileMenuClose.addEventListener("click", closeMobileMenu);
    mobileMenuBackdrop.addEventListener("click", closeMobileMenu);
</script>
```
