<div class="p-6">
    <h2 class="mb-6 text-lg font-semibold text-slate-900">Batch Information</h2>
    <dl class="space-y-6">
        <div>
            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Batch ID</dt>
            <dd class="mt-1 font-mono text-sm text-slate-800">
                #{{ batch.id|stringformat:"s"|slice:":8"|upper }}
            </dd>
        </div>
        <div>
            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Recipe</dt>
            <dd class="mt-1 text-sm font-medium text-slate-900">
                {{ batch.recipe_name }}
            </dd>
        </div>
        <div>
            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Batch Quantity</dt>
            <dd class="mt-1 text-sm text-slate-900">
                {{ batch.batch_qty|floatformat:0 }}
            </dd>
        </div>
        <div>
            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Created By</dt>
            <dd class="mt-1 text-sm text-slate-900">
                {{ batch.user }}
            </dd>
        </div>
    </dl>
</div>
