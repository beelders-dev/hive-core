<div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
    <div>
        <h2 class="text-lg font-semibold text-slate-900">Production</h2>
        <p class="text-sm text-slate-500">Production batches.</p>
    </div>
</div>
<div class="divide-y divide-slate-100">
    {% for batch in batches %}
        <a href="{% url 'production:batch' batch.pk %}">
            <div class="flex items-center justify-between px-6 py-4 hover:bg-slate-50">
                <div>
                    <p class="font-medium text-slate-900">{{ batch.recipe.name }}</p>
                    <div class="mt-1 flex flex-wrap items-center gap-3 text-sm text-slate-500">
                        <span>Batch #{{ batch.pk|stringformat:"s"|slice:":8"|upper }}</span>
                        <span>•</span>
                        <span>{{ batch.produced_at|date:"M d, Y · h:i A" }}</span>
                    </div>
                </div>
                <div>{% include "components/svgs/_chevron_right.svg" %}</div>
            </div>
        </a>
    {% empty %}
        <div class="px-6 py-10 text-center text-sm text-slate-500">No production history yet.</div>
    {% endfor %}
</div>
