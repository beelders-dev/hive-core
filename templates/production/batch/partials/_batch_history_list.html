<div class="divide-y divide-slate-100">
    {% for batch in batches %}
        <a href="{% url 'production:batch' batch.pk %}">
            <div class="flex items-center justify-between px-6 py-4 transition hover:bg-slate-50">
                <div>
                    <p class="font-medium text-slate-900">{{ batch.recipe_name }}</p>
                    <div class="mt-1 flex flex-wrap items-center gap-3 text-sm text-slate-500">
                        <span>Batch #{{ batch.pk|stringformat:"s"|slice:":8"|upper }}</span>
                        <span>•</span>
                        <span>{{ batch.created_at|date:"M d, Y · h:i A" }}</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium {% if batch.status == batch.Status.PENDING %} bg-amber-100 text-amber-800 {% elif batch.status == batch.Status.IN_PROGRESS %} bg-blue-100 text-blue-800 {% elif batch.status == batch.Status.COMPLETE %} bg-emerald-100 text-emerald-800 {% elif batch.status == batch.Status.CANCELLED %} bg-red-100 text-red-800 {% endif %}">
                        {{ batch.get_status_display }}
                    </span>
                    {% include "components/svgs/_chevron_right.svg" %}
                </div>
            </div>
        </a>
    {% empty %}
        <div class="px-6 py-10 text-center text-sm text-slate-500">No production history yet.</div>
    {% endfor %}
</div>
