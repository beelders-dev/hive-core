{% comment %}
Elements that have to change upon clicking "Mark as Complete".
{% endcomment %}
{# Status #}
{% include "production/batch/partials/_batch_status_oob.html" %}
{# Date completed #}
<dd id="completed-date"
    class="mt-1 text-sm text-slate-900"
    hx-swap-oob="innerHTML">
    {{ batch.completed_at|date:"M d, Y · h:i A"|default:"--" }}
</dd>
{# Button #}
<button id="complete-btn"
        hx-swap-oob="true"
        class="inline-flex items-center rounded-lg px-4 py-2 text-sm font-medium text-white shadow-sm transition bg-slate-400"
        disabled>✓ Mark as Complete</button>
