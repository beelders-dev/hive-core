<button type="submit"
        hx-post="{% url 'production:add_ingredient' ingredient.pk %}"
        hx-target="#selected-ingredients-row"
        hx-swap="beforeend"
        hx-include="[name='ingredient_ids']"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        title="Add ingredient"
        aria-label="Add ingredient">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="2"
             stroke="currentColor"
             class="h-4 w-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
</button>
